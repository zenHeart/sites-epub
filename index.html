<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <style>

    main { max-width: 960px; margin: 0 auto; padding: 3rem 1.5rem; }
    h1 { font-weight: 600; }
    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
             gap: 1.5rem; margin-top: 2rem; }
    .card { display: block; background: #171d24; border-radius: 16px; padding: 1.25rem;
             text-decoration: none; color: inherit; border: 1px solid #2a333d; }
    .card:hover { border-color: #e07755; }
    .cover { width: 96px; height: 96px; object-fit: contain; display: block; margin: 0 auto 1rem; }
    h2 { text-align: center; margin: 0 0 .4rem; font-size: 1.15rem; }
    p { text-align: center; margin: 0; color: #a4abb7; font-size: .9rem; }
  </style>
</head>
<body>
  <main>
    <h1>site EPUB</h1>
    <p>Official product docs + blog, packed as EPUB.</p>
    <div class="grid">
      
            <a class="card" href="codex.epub">
              <img class="cover" src="icons/codex.png" alt="Codex icon">
              <h2>Codex</h2>
              <p>Download EPUB</p>
            </a>

            <a class="card" href="claude.epub">
              <img class="cover" src="icons/claude.png" alt="Claude icon">
              <h2>Claude</h2>
              <p>Download EPUB</p>
            </a>

            <a class="card" href="cursor.epub">
              <img class="cover" src="icons/cursor.png" alt="Cursor icon">
              <h2>Cursor</h2>
              <p>Download EPUB</p>
            </a>
    </div>
  </main>
</body>
</html>
