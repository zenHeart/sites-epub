      '<span class="upd-date">' + esc(u.date) + '</span>' +
      (mode === 'timeline' ? '<span class="upd-vendor">' + esc(v.name) + '</span>' : '') +
      '<span class="stat"><span class="add">+' + aN(u) + '</span> <span class="rm">-' + rN(u) + '</span></span>' +
      '<div class="upd-subject">' + (isInitial ? 'Initial import · ' : '') + esc(u.subject) + ' <code style="opacity:.55">' + esc(u.short) + '</code></div>' +
      '</div>' + body + '</article>';
}
function render() {
  const vendors = active === 'all' ? DATA.vendors : DATA.vendors.filter(v => v.id === active);
  if (mode === 'vendor') {
    // 厂商聚类视图:每厂商一节,节内按提交时间轴倒序
    list.innerHTML = vendors.map(v =>
      '<section style="margin-bottom:2.4rem"><div style="display:flex;gap:.8rem;align-items:baseline;border-bottom:1px solid var(--line);padding-bottom:.5rem;margin-bottom:.9rem;flex-wrap:wrap">' +
      '<span class="upd-vendor" style="font-size:1.05rem">' + esc(v.name) + '</span>' +
      '<span class="upd-date">' + v.chapters + ' 章 · ' + v.updates.length + ' 次更新</span></div>' +
      v.updates.map(u => card(v, u)).join('') + '</section>'
    ).join('') || '<p class="intro">该厂商暂无更新记录。</p>';
    return;
  }
  const evs = [];
  vendors.forEach(v => v.updates.forEach(u => evs.push({ v, u })));
  evs.sort((a, b) => b.u.date.localeCompare(a.u.date) || (b.u.short || '').localeCompare(a.u.short || ''));
  list.innerHTML = evs.map(({ v, u }) => card(v, u)).join('') || '<p class="intro">该厂商暂无更新记录。</p>';
}
function renderFilters() {
  const seg = '<span style="display:flex;background:var(--chip);border-radius:999px;padding:2px">' +
    ['timeline','vendor'].map(m => '<button data-m="' + m + '" style="border:0;background:' + (mode === m ? 'var(--card)' : 'transparent') + ';color:' + (mode === m ? 'var(--ink)' : 'var(--muted)') + ';border-radius:999px;padding:.32rem .75rem;cursor:pointer;font-size:.75rem;box-shadow:' + (mode === m ? 'var(--shadow)' : 'none') + '">' + (m === 'timeline' ? '时间轴' : '按厂商') + '</button>').join('') + '</span>';
  const all = [{ id: 'all', name: '全部' }].concat(DATA.vendors.map(v => ({ id: v.id, name: v.name })));
  filters.innerHTML = seg + all.map(f =>
    '<button data-id="' + esc(f.id) + '" class="' + (f.id === active ? 'on' : '') + '">' + esc(f.name) + '</button>'
  ).join('');
  filters.querySelectorAll('button[data-m]').forEach(b => b.onclick = () => { mode = b.dataset.m; renderFilters(); render(); });
  filters.querySelectorAll('button[data-id]').forEach(b => b.onclick = () => { active = b.dataset.id; renderFilters(); render(); });
}
document.getElementById('foot').textContent = 'generated ' + DATA.generated_at + ' · derived from routes.json git history';
renderFilters();
render();
</script>
</body>
</html>
