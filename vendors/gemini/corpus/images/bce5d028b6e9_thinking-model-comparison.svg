<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1460 770" width="100%" height="100%" style="background-color: #ededed; font-family: 'Google Sans', 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;">
  <defs>
    <filter id="cardShadow" x="-3%" y="-2%" width="106%" height="108%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="4" stdDeviation="12" flood-color="#000000" flood-opacity="0.06"/>
      <feDropShadow dx="0" dy="1" stdDeviation="3" flood-color="#000000" flood-opacity="0.04"/>
    </filter>

    <marker id="arrowGray" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 1 1.5 L 7 5 L 1 8.5" fill="none" stroke="#9ca3af" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <marker id="arrowPink" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 1 1.5 L 7 5 L 1 8.5" fill="none" stroke="#d81b60" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <marker id="arrowAmber" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 1 1.5 L 7 5 L 1 8.5" fill="none" stroke="#d97706" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <marker id="arrowGreen" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 1 1.5 L 7 5 L 1 8.5" fill="none" stroke="#16a34a" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <!-- Overall Header -->
  <g id="header" transform="translate(0, 36)">
    <text x="730" y="0" text-anchor="middle" font-size="26" font-weight="700" fill="#202124" letter-spacing="-0.5">Live API: Function Calling &amp; State Tracking Comparison</text>
    <text x="730" y="26" text-anchor="middle" font-size="15" font-weight="400" fill="#5f6368">Synchronous Blocking Tools versus Thinking with Non-Blocking Tools &amp; Background Reasoning</text>
  </g>

  <!-- CARD 1: Standard Live Model -->
  <g id="card-standard-live" transform="translate(30, 95)">
    <rect width="660" height="650" rx="18" fill="#ffffff" stroke="#e5e7eb" stroke-width="1.5" filter="url(#cardShadow)"/>

    <!-- Header Badge & Model Title -->
    <g transform="translate(32, 28)">
      <rect width="195" height="26" rx="13" fill="#e8f0fe"/>
      <text x="97" y="18" text-anchor="middle" font-size="12" font-weight="700" fill="#1a73e8" letter-spacing="0.4">STANDARD LIVE MODEL</text>
      <text x="0" y="52" font-size="21" font-weight="700" fill="#202124">gemini-3.8-live</text>
    </g>

    <!-- Vertical Lifelines -->
    <line x1="150" y1="195" x2="150" y2="565" stroke="#e2e8f0" stroke-width="2" stroke-dasharray="5 5"/>
    <line x1="510" y1="195" x2="510" y2="565" stroke="#e2e8f0" stroke-width="2" stroke-dasharray="5 5"/>

    <!-- Client Node -->
    <g transform="translate(150, 138)">
      <circle cx="0" cy="0" r="34" fill="#e6f4ea"/>
      <rect x="-14" y="-11" width="28" height="18" rx="2.5" fill="none" stroke="#137333" stroke-width="2.2"/>
      <line x1="-18" y1="11" x2="18" y2="11" stroke="#137333" stroke-width="2.2" stroke-linecap="round"/>
      <text x="0" y="50" text-anchor="middle" font-size="16" font-weight="600" fill="#202124">Client</text>
    </g>

    <!-- Live API Node -->
    <g transform="translate(510, 138)">
      <circle cx="0" cy="0" r="34" fill="#fce4ec"/>
      <circle cx="0" cy="0" r="3.5" fill="#d81b60"/>
      <path d="M -6 -7 A 9 9 0 0 0 -6 7" fill="none" stroke="#d81b60" stroke-width="2.2" stroke-linecap="round"/>
      <path d="M 6 -7 A 9 9 0 0 1 6 7" fill="none" stroke="#d81b60" stroke-width="2.2" stroke-linecap="round"/>
      <path d="M -13 -13 A 18 18 0 0 0 -13 13" fill="none" stroke="#d81b60" stroke-width="2.2" stroke-linecap="round"/>
      <path d="M 13 -13 A 18 18 0 0 1 13 13" fill="none" stroke="#d81b60" stroke-width="2.2" stroke-linecap="round"/>
      <text x="0" y="50" text-anchor="middle" font-size="16" font-weight="600" fill="#202124">Live API</text>
    </g>

    <!-- Step 1: User Audio Stream -->
    <g transform="translate(0, 230)">
      <path d="M 150 0 L 500 0" stroke="#9ca3af" stroke-width="2.2" marker-end="url(#arrowGray)"/>
      <text x="330" y="-12" text-anchor="middle" font-size="15.5" font-weight="600" fill="#202124">1. User Audio Stream</text>
    </g>

    <!-- Step 2: toolCall -->
    <g transform="translate(0, 300)">
      <path d="M 510 0 L 160 0" stroke="#d97706" stroke-width="2.2" marker-end="url(#arrowAmber)"/>
      <text x="330" y="-13" text-anchor="middle" font-size="15.5" font-weight="600" fill="#202124">2. toolCall: searchFlights(...)</text>
      <g transform="translate(205, 10)">
        <rect x="0" y="0" width="250" height="24" rx="6" fill="#fef2f2" stroke="#fecaca" stroke-width="1"/>
        <text x="125" y="17" text-anchor="middle" font-size="13" font-weight="700" fill="#991b1b">Synchronous (Blocks speech)</text>
      </g>
    </g>

    <!-- Step 3: toolResponse -->
    <g transform="translate(0, 375)">
      <path d="M 150 0 L 500 0" stroke="#9ca3af" stroke-width="2.2" stroke-dasharray="5 4" marker-end="url(#arrowGray)"/>
      <text x="330" y="-12" text-anchor="middle" font-size="15.5" font-weight="600" fill="#202124">3. toolResponse: { flight: "DL 145" }</text>
    </g>

    <!-- Step 4: Model Audio Response -->
    <g transform="translate(0, 450)">
      <path d="M 510 0 L 160 0" stroke="#d81b60" stroke-width="2.2" marker-end="url(#arrowPink)"/>
      <text x="330" y="-13" text-anchor="middle" font-size="15.5" font-weight="600" fill="#202124">4. Model Audio Response</text>
    </g>

    <!-- Step 5: turnComplete -->
    <g transform="translate(0, 520)">
      <path d="M 510 0 L 160 0" stroke="#9ca3af" stroke-width="2.2" marker-end="url(#arrowGray)"/>
      <g transform="translate(245, -13)">
        <rect x="0" y="0" width="170" height="26" rx="6" fill="#fee2e2" stroke="#fca5a5" stroke-width="1"/>
        <text x="85" y="18" text-anchor="middle" font-size="13" font-weight="700" fill="#991b1b">turnComplete: true</text>
      </g>
    </g>

    <!-- Footer Client UI Status Pill -->
    <g transform="translate(330, 595)">
      <rect x="-220" y="-18" width="440" height="36" rx="18" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
      <text x="0" y="5" text-anchor="middle" font-size="14" font-weight="500" fill="#475569">Client UI: <tspan font-weight="700" fill="#991b1b">Silent Tool Wait</tspan> ➔ <tspan font-weight="700" fill="#1e293b">Speaking ➔ Idle</tspan></text>
    </g>
  </g>

  <!-- CARD 2: Thinking Model -->
  <g id="card-thinking" transform="translate(720, 95)">
    <rect width="710" height="650" rx="18" fill="#ffffff" stroke="#e5e7eb" stroke-width="1.5" filter="url(#cardShadow)"/>

    <!-- Header Badge & Model Title -->
    <g transform="translate(32, 28)">
      <rect width="135" height="26" rx="13" fill="#fef3c7"/>
      <text x="67" y="18" text-anchor="middle" font-size="12" font-weight="700" fill="#b45309" letter-spacing="0.4">THINKING</text>
      <text x="0" y="52" font-size="21" font-weight="700" fill="#202124">gemini-3.8-live-extended-thinking</text>
    </g>

    <!-- Vertical Lifelines -->
    <line x1="135" y1="195" x2="135" y2="565" stroke="#e2e8f0" stroke-width="2" stroke-dasharray="5 5"/>
    <line x1="525" y1="195" x2="525" y2="565" stroke="#e2e8f0" stroke-width="2" stroke-dasharray="5 5"/>

    <!-- Background Reasoning & Tools vertical bar on Live API lifeline -->
    <rect x="510" y="220" width="30" height="340" rx="8" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.8"/>

    <!-- Reasoning Callout Box to the right of Live API line -->
    <g transform="translate(552, 365)">
      <rect x="0" y="0" width="142" height="54" rx="7" fill="#fef3c7" stroke="#fde68a" stroke-width="1"/>
      <path d="M 12 10 C 12 4.5 16.5 0 22 0 C 16.5 0 12 -4.5 12 -10 C 12 -4.5 7.5 0 2 0 C 7.5 0 12 4.5 12 10 Z" fill="#d97706" transform="translate(6, 13) scale(0.75)"/>
      <text x="26" y="23" font-size="12.5" font-weight="700" fill="#92400e">Background</text>
      <text x="26" y="40" font-size="12.5" font-weight="700" fill="#92400e">Reasoning &amp; Tools</text>
    </g>

    <!-- Client Node -->
    <g transform="translate(135, 138)">
      <circle cx="0" cy="0" r="34" fill="#e6f4ea"/>
      <rect x="-14" y="-11" width="28" height="18" rx="2.5" fill="none" stroke="#137333" stroke-width="2.2"/>
      <line x1="-18" y1="11" x2="18" y2="11" stroke="#137333" stroke-width="2.2" stroke-linecap="round"/>
      <text x="0" y="50" text-anchor="middle" font-size="16" font-weight="600" fill="#202124">Client</text>
    </g>

    <!-- Live API Node -->
    <g transform="translate(525, 138)">
      <circle cx="0" cy="0" r="34" fill="#fce4ec"/>
      <circle cx="0" cy="0" r="3.5" fill="#d81b60"/>
      <path d="M -6 -7 A 9 9 0 0 0 -6 7" fill="none" stroke="#d81b60" stroke-width="2.2" stroke-linecap="round"/>
      <path d="M 6 -7 A 9 9 0 0 1 6 7" fill="none" stroke="#d81b60" stroke-width="2.2" stroke-linecap="round"/>
      <path d="M -13 -13 A 18 18 0 0 0 -13 13" fill="none" stroke="#d81b60" stroke-width="2.2" stroke-linecap="round"/>
      <path d="M 13 -13 A 18 18 0 0 1 13 13" fill="none" stroke="#d81b60" stroke-width="2.2" stroke-linecap="round"/>
      <text x="0" y="50" text-anchor="middle" font-size="16" font-weight="600" fill="#202124">Live API</text>
    </g>

    <!-- Step 1: User Audio Stream -->
    <g transform="translate(0, 230)">
      <path d="M 135 0 L 500 0" stroke="#9ca3af" stroke-width="2.2" marker-end="url(#arrowGray)"/>
      <text x="320" y="-12" text-anchor="middle" font-size="15.5" font-weight="600" fill="#202124">1. User Audio Stream</text>
    </g>

    <!-- Step 2: Spoken Filler -->
    <g transform="translate(0, 300)">
      <path d="M 510 0 L 145 0" stroke="#d81b60" stroke-width="2.2" marker-end="url(#arrowPink)"/>
      <text x="320" y="-13" text-anchor="middle" font-size="15.5" font-weight="600" fill="#202124">2. Spoken Filler ("Checking flights...")</text>
      <g transform="translate(145, 10)">
        <rect x="0" y="0" width="160" height="24" rx="6" fill="#fee2e2" stroke="#fca5a5" stroke-width="1"/>
        <text x="80" y="17" text-anchor="middle" font-size="13" font-weight="700" fill="#991b1b">turnComplete: true</text>
      </g>
      <g transform="translate(315, 10)">
        <rect x="0" y="0" width="185" height="24" rx="6" fill="#fef3c7" stroke="#fde68a" stroke-width="1"/>
        <text x="92" y="17" text-anchor="middle" font-size="13" font-weight="700" fill="#b45309">status: "IN_PROGRESS"</text>
      </g>
    </g>

    <!-- Step 3: toolCall -->
    <g transform="translate(0, 375)">
      <path d="M 510 0 L 145 0" stroke="#d97706" stroke-width="2.2" marker-end="url(#arrowAmber)"/>
      <text x="320" y="-13" text-anchor="middle" font-size="15.5" font-weight="600" fill="#202124">3. toolCall: searchFlights(...)</text>
      <g transform="translate(228, 10)">
        <rect x="0" y="0" width="185" height="24" rx="6" fill="#fef3c7" stroke="#fde68a" stroke-width="1"/>
        <text x="92" y="17" text-anchor="middle" font-size="13" font-weight="700" fill="#b45309">status: "IN_PROGRESS"</text>
      </g>
    </g>

    <!-- Step 4: toolResponse -->
    <g transform="translate(0, 450)">
      <path d="M 135 0 L 500 0" stroke="#9ca3af" stroke-width="2.2" stroke-dasharray="5 4" marker-end="url(#arrowGray)"/>
      <text x="320" y="-12" text-anchor="middle" font-size="15.5" font-weight="600" fill="#202124">4. toolResponse: { flight: "DL 145" }</text>
    </g>

    <!-- Step 5: Final Spoken Response -->
    <g transform="translate(0, 520)">
      <path d="M 510 0 L 145 0" stroke="#16a34a" stroke-width="2.2" marker-end="url(#arrowGreen)"/>
      <text x="320" y="-13" text-anchor="middle" font-size="15.5" font-weight="600" fill="#202124">5. Final Spoken Response</text>
      <g transform="translate(165, 10)">
        <rect x="0" y="0" width="160" height="24" rx="6" fill="#fee2e2" stroke="#fca5a5" stroke-width="1"/>
        <text x="80" y="17" text-anchor="middle" font-size="13" font-weight="700" fill="#991b1b">turnComplete: true</text>
      </g>
      <g transform="translate(335, 10)">
        <rect x="0" y="0" width="135" height="24" rx="6" fill="#dcfce7" stroke="#86efac" stroke-width="1"/>
        <text x="67" y="17" text-anchor="middle" font-size="13" font-weight="700" fill="#14532d">status: "IDLE"</text>
      </g>
    </g>

    <!-- Footer Client UI Status Pill -->
    <g transform="translate(355, 595)">
      <rect x="-275" y="-18" width="550" height="36" rx="18" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
      <text x="0" y="5" text-anchor="middle" font-size="14" font-weight="500" fill="#475569">Client UI: <tspan font-weight="700" fill="#b45309">Thinking / Filler</tspan> ➔ <tspan font-weight="700" fill="#5b21b6">Tool Exec</tspan> ➔ <tspan font-weight="700" fill="#15803d">Final Answer ➔ Idle</tspan></text>
    </g>
  </g>
</svg>
