name: Build EPUB

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      force:
        description: Rebuild every vendor EPUB even if corpus and packer are unchanged
        type: boolean
        default: false

concurrency:
  group: build-epub-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  pack:
    name: Pack EPUBs from committed corpus
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      SITESEPUB_OFFLINE: "1"
    steps:
      - uses: actions/checkout@v4

      - name: Restore previously published EPUBs
        continue-on-error: true
        uses: actions/checkout@v4
        with:
          ref: gh-pages
          path: prev-site

      - name: Install pandoc and python deps
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends pandoc python3-pip python3-lxml
          python3 -m pip install --user beautifulsoup4 lxml
          pandoc --version | head -1

      - name: Pack catalog vendors (offline)
        env:
          SITESEPUB_PREV_SITE: prev-site
          SITESEPUB_FORCE: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.force == 'true' && '1' || '0' }}
        run: |
          python3 -m sites_epub pack
          python3 -m sites_epub catalog --dest site
          ls -la dist/*.epub site/

      - name: Validate EPUBs
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import zipfile
          epubs = list(Path("dist").glob("*.epub"))
          assert epubs, "no epub produced"
          for p in epubs:
              assert p.stat().st_size > 1000
              with zipfile.ZipFile(p) as zf:
                  assert zf.read("mimetype").decode().strip() == "application/epub+zip"
              from sites_epub.walk import blocking_defects, walk_chapters
              report = walk_chapters(p)
              broken = [
                  (c.chapter, d)
                  for c in report.chapters
                  for d in blocking_defects(c.defects)
              ]
              assert not broken, broken
              print("ok", p.name, p.stat().st_size)
          PY
          # Regression gate: cover.xhtml / OPF / metadata.yaml must not leak
          # the hardcoded "ChatGPT Codex Docs" title from the original codex pack.
          for e in dist/*.epub; do
            python3 .agents/skills/site2epub/scripts/check_epub.py "$e" >/dev/null
          done
          echo "all covers ok"

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: vendor-epubs
          path: |
            dist/*.epub
            site/index.html
            site/CNAME
            site/icons/*
          retention-days: 30

      - name: Publish gh-pages
        if: github.ref == 'refs/heads/main'
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: site
          cname: epub.zenheart.site
