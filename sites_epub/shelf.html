<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ZenShelf · 站点 EPUB</title>
  <meta name="description" content="官方文档与博客 EPUB，以及源码级技术书站点。">
  <style>
    :root {
      color-scheme: light dark;
      --paper: #fcfbf9;
      --paper-2: #f6f5f0;
      --ink: #1c1a19;
      --muted: #8a8478;
      --line: rgba(44, 42, 41, .12);
      --card: #fff;
      --shadow: 0 8px 24px -6px rgba(0,0,0,.08), 0 2px 6px -1px rgba(0,0,0,.04);
      --shadow-hover: 0 16px 32px -8px rgba(0,0,0,.14);
      --accent: #2c2a29;
      --chip: #f1eee6;
    }
    html.dark {
      --paper: #121110;
      --paper-2: #1c1a19;
      --ink: #f4f0ea;
      --muted: #9a9488;
      --line: rgba(244, 240, 234, .12);
      --card: #1c1a19;
      --shadow: 0 10px 30px -8px rgba(0,0,0,.5);
      --shadow-hover: 0 18px 36px -10px rgba(0,0,0,.6);
      --accent: #f4f0ea;
      --chip: #2a2724;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; }
    body {
      background: var(--paper);
      color: var(--ink);
      font-family: Inter, "PingFang SC", "Noto Sans SC", sans-serif;
      -webkit-font-smoothing: antialiased;
    }
    a { color: inherit; }
    .wrap { max-width: 72rem; margin: 0 auto; padding: 0 1.5rem; min-height: 100vh; display: flex; flex-direction: column; }
    header { padding: 2.2rem 0 1.6rem; display: flex; gap: 1.25rem; justify-content: space-between; align-items: flex-end; flex-wrap: wrap; border-bottom: 1px solid var(--line); }
    .brand h1 { margin: 0; font-family: "Iowan Old Style", "Songti SC", "Noto Serif SC", serif; font-weight: 400; letter-spacing: .06em; font-size: 1.7rem; cursor: pointer; }
    .brand p { margin: .35rem 0 0; font-size: .7rem; letter-spacing: .18em; text-transform: uppercase; color: var(--muted); font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }
    .tools { display: flex; gap: .6rem; align-items: center; flex-wrap: wrap; }
    .search { position: relative; }
    .search input {
      width: 15rem; max-width: 70vw; border: 0; background: var(--chip); color: var(--ink);
      border-radius: 999px; padding: .45rem .9rem .45rem 2rem; font-size: .8rem; outline: none;
    }
    .search svg { position: absolute; left: .7rem; top: 50%; transform: translateY(-50%); opacity: .45; }
    .seg { display: flex; background: var(--chip); border-radius: 999px; padding: 2px; }
    .seg button, .icon-btn {
      border: 0; background: transparent; color: var(--muted); border-radius: 999px;
      padding: .35rem .7rem; cursor: pointer; font-size: .75rem;
    }
    .seg button.on { background: var(--card); color: var(--ink); box-shadow: var(--shadow); }
    .icon-btn { padding: .45rem; }
    .sub { display: flex; justify-content: space-between; align-items: center; gap: 1rem; padding: 1rem 0; border-bottom: 1px solid var(--line); font-size: .8rem; }
    .tabs { display: flex; gap: 1.4rem; overflow-x: auto; }
    .tabs button { border: 0; background: none; color: var(--muted); padding: 0 0 .35rem; cursor: pointer; white-space: nowrap; }
    .tabs button.on { color: var(--ink); border-bottom: 1px solid var(--ink); font-weight: 500; }
    .count { color: var(--muted); font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: .7rem; }
    main { flex: 1; padding: 2.4rem 0 3rem; }
    .grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 2rem 1.4rem; }
    @media (min-width: 640px) { .grid { grid-template-columns: repeat(3, 1fr); } }
    @media (min-width: 900px) { .grid { grid-template-columns: repeat(4, 1fr); gap: 2.4rem 2rem; } }
    .book { cursor: pointer; display: flex; flex-direction: column; }
    .cover {
      aspect-ratio: 3 / 4; border-radius: .7rem; overflow: hidden; background: var(--paper-2);
      box-shadow: var(--shadow); margin-bottom: .9rem; position: relative; transition: transform .35s cubic-bezier(.16,1,.3,1), box-shadow .35s;
    }
    .book:hover .cover { transform: translateY(-4px); box-shadow: var(--shadow-hover); }
    .cover img.full {
      position: absolute; inset: 0; width: 100%; height: 100%;
      object-fit: cover; object-position: center; display: block;
    }
    .plate {
      width: 100%; height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center;
      padding: 1.2rem; text-align: center; gap: .7rem;
    }
    .plate .logo { width: 3.4rem; height: 3.4rem; object-fit: contain; }
    .plate .kicker { font-size: .6rem; letter-spacing: .22em; text-transform: uppercase; color: var(--muted); font-family: ui-monospace, Menlo, monospace; }
    .plate .cname { font-family: "Iowan Old Style", "Songti SC", serif; font-size: 1.15rem; }
    .tone-codex { background: linear-gradient(165deg, #111 0%, #2a2a2a 100%); color: #f4f0ea; }
    .tone-claude { background: linear-gradient(165deg, #2b1d16 0%, #c96442 140%); color: #faf6f1; }
    .tone-cursor { background: linear-gradient(165deg, #0e1116 0%, #3d4654 100%); color: #eef2f6; }
    .meta h3 { margin: 0; font-family: "Iowan Old Style", "Songti SC", serif; font-size: .92rem; font-weight: 600; }
    .meta p { margin: .2rem 0 0; font-size: .75rem; color: var(--muted); }
    .meta time { display: block; margin-top: .25rem; font-size: .68rem; color: var(--muted); font-family: ui-monospace, Menlo, monospace; }
    .list { border-top: 1px solid var(--line); border-bottom: 1px solid var(--line); }
    .row { display: flex; align-items: center; justify-content: space-between; gap: 1rem; padding: .9rem .4rem; cursor: pointer; border-bottom: 1px solid var(--line); }
    .row:last-child { border-bottom: 0; }
    .row:hover { background: color-mix(in srgb, var(--chip) 70%, transparent); }
    .row-left { display: flex; align-items: center; gap: .9rem; min-width: 0; }
    .thumb { width: 2.1rem; height: 2.85rem; border-radius: .25rem; overflow: hidden; background: var(--chip); flex-shrink: 0; }
    .thumb img { width: 100%; height: 100%; object-fit: cover; }
    .thumb .mini { width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; }
    .thumb .mini img { width: 1.2rem; height: 1.2rem; object-fit: contain; }
    .empty { text-align: center; padding: 6rem 1rem; color: var(--muted); font-family: "Songti SC", serif; }
    footer { padding: 2rem 0; border-top: 1px solid var(--line); text-align: center; color: var(--muted); font-size: .75rem; font-family: "Songti SC", serif; }
    .modal { position: fixed; inset: 0; background: rgba(28,26,25,.42); backdrop-filter: blur(8px); display: none; align-items: center; justify-content: center; padding: 1.2rem; z-index: 20; }
    .modal.on { display: flex; }
    .sheet { width: min(36rem, 100%); background: var(--paper); color: var(--ink); border-radius: 1.1rem; padding: 1.6rem; box-shadow: var(--shadow-hover); position: relative; }
    .sheet .x { position: absolute; top: .9rem; right: .9rem; border: 0; background: none; color: var(--muted); cursor: pointer; font-size: 1.2rem; }
    .detail { display: flex; gap: 1.2rem; align-items: flex-start; flex-wrap: wrap; }
    .detail .cover { width: 8.5rem; margin: 0; flex-shrink: 0; }
    .detail h2 { margin: 0; font-family: "Iowan Old Style", "Songti SC", serif; font-size: 1.25rem; }
    .detail .by { color: var(--muted); font-size: .8rem; margin: .3rem 0 .8rem; }
    .detail .sum { font-size: .85rem; line-height: 1.55; }
    .facts { margin-top: .9rem; font-size: .72rem; color: var(--muted); font-family: ui-monospace, Menlo, monospace; display: grid; gap: .25rem; }
    .actions { margin-top: 1.1rem; padding-top: .9rem; border-top: 1px solid var(--line); display: flex; gap: .5rem; flex-wrap: wrap; }
    .btn { display: inline-flex; align-items: center; justify-content: center; padding: .55rem 1rem; border-radius: 999px; text-decoration: none; font-size: .78rem; border: 1px solid var(--line); }
    .btn.primary { background: var(--ink); color: var(--paper); border-color: transparent; }
  </style>
</head>
<body>
  <div class="wrap">
    <header>
      <div class="brand">
        <h1 onclick="resetFilters()">ZenShelf</h1>
        <p>藏书柜 · site EPUB</p>
      </div>
      <div class="tools">
        <div class="search">
          <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg>
          <input id="search-input" type="search" placeholder="搜索书名、作者…">
        </div>
        <div class="seg">
          <button id="view-btn-grid" class="on" onclick="setViewMode('grid')">网格</button>
          <button id="view-btn-list" onclick="setViewMode('list')">列表</button>
        </div>
        <button class="icon-btn" title="切换主题" onclick="toggleDarkMode()">◐</button>
      </div>
    </header>
    <div class="sub">
      <nav class="tabs" id="category-tabs"></nav>
      <span class="count" id="book-count-label"></span>
    </div>
    <main id="books-container"></main>
    <footer>ZenShelf · 文档站 EPUB 与源码书入口</footer>
  </div>
  <div id="detail-modal" class="modal">
    <div class="sheet" id="detail-card">
      <button class="x" onclick="closeDetailModal()" aria-label="关闭">×</button>
      <div class="detail" id="detail-content"></div>
    </div>
  </div>
  <script>
    const BOOKS = __BOOKS_JSON__;
    const CATEGORIES = [
      { id: "all", label: "全部图书" },
      { id: "docs", label: "厂商文档" },
      { id: "handbook", label: "源码书" }
    ];
    const state = { viewMode: "grid", activeCategory: "all", searchQuery: "" };

    function coverHTML(b, cls) {
      if (b.coverKind === "image") {
        return `<div class="${cls}"><img class="full" src="${b.cover}" alt="${esc(b.title)}"></div>`;
      }
      return `<div class="${cls} plate tone-${b.tone || "codex"}"><img class="logo" src="${b.cover}" alt=""><div class="kicker">EPUB</div><div class="cname">${esc(b.title)}</div></div>`;
    }
    function esc(s) {
      return String(s || "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[c]));
    }
    function fmtDate(iso) {
      if (!iso) return "";
      return iso.slice(0, 10);
    }
    function getFilteredBooks() {
      const q = state.searchQuery.toLowerCase();
      return BOOKS.filter(b => {
        if (q && !(`${b.title} ${b.author}`.toLowerCase().includes(q))) return false;
        if (state.activeCategory !== "all" && b.category !== state.activeCategory) return false;
        return true;
      });
    }
    function renderCategories() {
      document.getElementById("category-tabs").innerHTML = CATEGORIES.map(c =>
        `<button class="${state.activeCategory===c.id?"on":""}" onclick="setCategory('${c.id}')">${c.label}</button>`
      ).join("");
    }
    function openBook(id) {
      const b = BOOKS.find(x => x.id === id);
      if (!b) return;
      if (b.kind === "site") {
        window.location.href = b.href;
        return;
      }
      openBookDetail(b);
    }
    function openBookDetail(b) {
      const packed = fmtDate(b.packedAt);
      const fetched = fmtDate(b.updatedAt);
      document.getElementById("detail-content").innerHTML = `
        ${coverHTML(b, "cover")}
        <div style="flex:1;min-width:12rem">
          <div class="kicker" style="font-size:.65rem;letter-spacing:.18em;text-transform:uppercase;color:var(--muted);font-family:ui-monospace,Menlo,monospace">${esc(b.categoryLabel)}</div>
          <h2>${esc(b.title)}</h2>
          <p class="by">${esc(b.author)}</p>
          <p class="sum">${esc(b.summary)}</p>
          <div class="facts">
            ${fetched ? `<div>语料更新 ${fetched}</div>` : ""}
            ${packed ? `<div>最近成书 ${packed}</div>` : ""}
            ${b.chapters ? `<div>${b.chapters} 篇</div>` : ""}
          </div>
          <div class="actions">
            <a class="btn primary" href="${esc(b.href)}">下载 EPUB</a>
            ${b.docsUrl ? `<a class="btn" href="${esc(b.docsUrl)}" target="_blank" rel="noopener">文档站</a>` : ""}
            ${b.blogUrl ? `<a class="btn" href="${esc(b.blogUrl)}" target="_blank" rel="noopener">博客</a>` : ""}
          </div>
        </div>`;
      document.getElementById("detail-modal").classList.add("on");
    }
    function closeDetailModal() { document.getElementById("detail-modal").classList.remove("on"); }
    function renderBooks() {
      const books = getFilteredBooks();
      document.getElementById("book-count-label").textContent = `${books.length} 本图书`;
      const box = document.getElementById("books-container");
      if (!books.length) {
        box.innerHTML = `<div class="empty">未找到匹配的藏书</div>`;
        return;
      }
      if (state.viewMode === "grid") {
        box.innerHTML = `<div class="grid">${books.map(b => `
          <article class="book" onclick="openBook('${b.id}')">
            ${coverHTML(b, "cover")}
            <div class="meta">
              <h3>${esc(b.title)}</h3>
              <p>${esc(b.author)}</p>
              <time>${fmtDate(b.updatedAt) ? "语料 " + fmtDate(b.updatedAt) : (fmtDate(b.packedAt) ? "成书 " + fmtDate(b.packedAt) : "")}</time>
            </div>
          </article>`).join("")}</div>`;
      } else {
        box.innerHTML = `<div class="list">${books.map(b => `
          <div class="row" onclick="openBook('${b.id}')">
            <div class="row-left">
              <div class="thumb">${b.coverKind==="image"?`<img src="${b.cover}" alt="">`:`<div class="mini plate tone-${b.tone||"codex"}"><img src="${b.cover}" alt=""></div>`}</div>
              <div class="meta">
                <h3>${esc(b.title)}</h3>
                <p>${esc(b.author)}</p>
              </div>
            </div>
            <div class="count">${fmtDate(b.updatedAt) || fmtDate(b.packedAt) || ""}</div>
          </div>`).join("")}</div>`;
      }
    }
    function setViewMode(mode) {
      state.viewMode = mode;
      document.getElementById("view-btn-grid").className = mode === "grid" ? "on" : "";
      document.getElementById("view-btn-list").className = mode === "list" ? "on" : "";
      renderBooks();
    }
    function setCategory(id) { state.activeCategory = id; renderCategories(); renderBooks(); }
    function resetFilters() {
      state.activeCategory = "all"; state.searchQuery = "";
      document.getElementById("search-input").value = "";
      renderCategories(); renderBooks();
    }
    function toggleDarkMode() { document.documentElement.classList.toggle("dark"); }
    window.addEventListener("DOMContentLoaded", () => {
      if (window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches) {
        document.documentElement.classList.add("dark");
      }
      renderCategories(); renderBooks();
      document.getElementById("search-input").addEventListener("input", e => {
        state.searchQuery = e.target.value.trim();
        renderBooks();
      });
      document.getElementById("detail-modal").addEventListener("click", e => {
        if (e.target.id === "detail-modal") closeDetailModal();
      });
    });
  </script>
</body>
</html>
